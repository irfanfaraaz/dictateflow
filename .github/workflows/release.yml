# Build the macOS app and publish a GitHub Release whenever a version tag
# is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The curl installer (scripts/install.sh) always installs the newest
# release, so users get the new build as soon as this finishes.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: Actions → Release → Run workflow, enter e.g. v0.2.0.
  # The release (and its tag, if missing) is created on the selected commit.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    # macos-14 = Apple Silicon (arm64) runner → DictateFlow_<ver>_aarch64.dmg
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A tag that doesn't match the app version would ship e.g. a "v0.3.0"
      # release containing DictateFlow_0.2.0_aarch64.dmg.
      - name: Check tag matches app version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          conf="$(jq -r .version src-tauri/tauri.conf.json)"
          cargo_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          pkg="$(jq -r .version package.json)"
          echo "tag=$TAG tauri.conf=$conf Cargo.toml=$cargo_ver package.json=$pkg"
          [ "$TAG" = "v$conf" ] || { echo "::error::Tag $TAG does not match tauri.conf.json version $conf"; exit 1; }
          [ "$conf" = "$cargo_ver" ] && [ "$conf" = "$pkg" ] || { echo "::error::Version mismatch between tauri.conf.json, Cargo.toml and package.json"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        run: |
          pnpm exec tsc -b
          pnpm exec vitest run

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: DictateFlow ${{ inputs.tag || github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          # Draft first: the release only becomes "latest" (what install.sh
          # downloads) after every asset has been uploaded.
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Install

            Paste into Terminal (no Gatekeeper prompt):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/irfanfaraaz/dictateflow/main/scripts/install.sh | bash
            ```

            Or download the `.dmg` below. It's unsigned, so after dragging it to
            Applications run `xattr -cr /Applications/DictateFlow.app` once.

            Requires macOS on Apple Silicon (M1+).

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
