[package]
name = "dictateflow"
version = "0.2.0"
edition = "2021"

[lib]
name = "dictateflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"

# async + error
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "1"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# audio capture + ring buffer
cpal = "0.15"
ringbuf = "0.4"

# macOS interop (NSWindow click-through, NSEvent cursor, NSWorkspace deep-links)
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSScreen",
    "NSWorkspace",
    "NSSound",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "libc",
] }
objc2-foundation = { version = "0.2", features = [
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSArray",
    "NSThread",
    "NSData",
    "NSRange",
] }
core-graphics = "0.24"
core-foundation = "0.10"

# whisper.cpp via whisper-rs (Metal acceleration on Apple Silicon)
whisper-rs = { version = "0.13", features = ["metal"] }

# WAV decoding for tests + (later) fixture utilities
hound = "3.5"

# Resource resolution for the bundled GGML model
dirs = "5"

# macOS Keychain (Phase 7.1: BYOK secret storage)
security-framework = "2"

# WebSocket client for Scribe v2 streaming engine (Phase 7.2)
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
url = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
sha2 = "0.10"

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
print_stdout = "warn"
