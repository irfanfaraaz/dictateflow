[package]
name = "wispertype"
version = "0.1.0"
edition = "2021"

[lib]
name = "wispertype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"

# async + error
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "1"

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# audio capture + ring buffer
cpal = "0.15"
ringbuf = "0.4"

# macOS interop (NSWindow click-through, NSEvent cursor, NSWorkspace deep-links)
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSWindow",
    "NSResponder",
    "NSEvent",
    "NSScreen",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.2", features = [
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSArray",
    "NSThread",
] }
core-graphics = "0.24"

# whisper.cpp via whisper-rs (Metal acceleration on Apple Silicon)
whisper-rs = { version = "0.13", features = ["metal"] }

# WAV decoding for tests + (later) fixture utilities
hound = "3.5"

# Resource resolution for the bundled GGML model
dirs = "5"

# Clipboard read/write for Phase 3 paste injection
arboard = "3.4"

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
todo = "warn"
print_stdout = "warn"
